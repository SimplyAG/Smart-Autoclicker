pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Stonecutter'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.7.11'
}

// One source tree, one Gradle project per Minecraft version (versions/<mc>/gradle.properties).
// Version-specific code is written as Stonecutter comments, e.g. //? if >=26.2 { ... } in src/.
// Which versions share a published jar is decided by release-groups.json, not here.
stonecutter {
	kotlinController = false
	centralScript = 'build.gradle'
	create(rootProject) {
		// Obfuscated Minecraft (1.21.x): remap.gradle compiles against Mojang's official mappings and remaps the
		// jar to intermediary, Java 21.
		versions('1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9',
				'1.21.10', '1.21.11').buildscript('remap.gradle')
		// Unobfuscated Minecraft (26.1+): Mojang names natively, non-remapping Loom (build.gradle), Java 25.
		versions '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
	}
}

rootProject.name = 'smart-autoclicker'
