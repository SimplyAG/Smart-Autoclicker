pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Stonecutter'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.7.11'
	// Downloads any JDK a version needs that isn't installed (8 for 1.14-1.16, 16 for 1.17), locally and on CI.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// One source tree, one Gradle project per Minecraft version (versions/<mc>/gradle.properties).
// Version-specific code is written as Stonecutter comments, e.g. //? if >=26.2 { ... } in src/.
// Which versions share a published jar is decided by release-groups.json, not here.
stonecutter {
	kotlinController = false
	centralScript = 'build.gradle'
	create(rootProject) {
		// Obfuscated Minecraft (1.14.4 - 1.21.11): remap.gradle compiles against Mojang's official mappings and remaps the
		// jar to intermediary, Java 8 to 21 depending on the version.
		versions('1.14.4', '1.15', '1.15.1', '1.15.2', '1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
				'1.17', '1.17.1', '1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4', '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9',
				'1.21.10', '1.21.11').buildscript('remap.gradle')
		// Unobfuscated Minecraft (26.1+): Mojang names natively, non-remapping Loom (build.gradle), Java 25.
		versions '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
	}
}

rootProject.name = 'smart-autoclicker'
