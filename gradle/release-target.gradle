// Per-target release wiring, applied by build.gradle right after its plugins block.
// Sets the ext.sac* values the build script uses afterwards:
//
//   ext.sacGroupVersions     Minecraft versions served by this target's release group (release-groups.json)
//   ext.sacIsLead            true if this target builds the group's published jar (the group's first version)
//   ext.sacJavaVersion       Java level of the group lead; every member compiles at it, so classes can be compared
//   ext.sacMinecraftDepItems fabric.mod.json "depends.minecraft" items
//   ext.sacReleaseJarFile    the jar that is verified and staged
//
//   verifyJarContents        fails if the jar contains anything outside the allowlist (wired into build)

import groovy.json.JsonSlurper

import java.util.zip.ZipFile

def mcVersion = project.property('minecraft_version') as String
def releaseGroup = rootProject.ext.sacReleaseGroups.find { it.minecraft.contains(mcVersion) }
if (releaseGroup == null) throw new GradleException("Minecraft ${mcVersion} is missing from release-groups.json")

def leadVersion = releaseGroup.minecraft[0] as String
def leadProperties = new Properties()
rootProject.file("versions/${leadVersion}/gradle.properties").withInputStream { leadProperties.load(it) }

ext.sacGroupVersions = releaseGroup.minecraft as List<String>
ext.sacIsLead = leadVersion == mcVersion
ext.sacJavaVersion = Integer.parseInt(leadProperties.getProperty('java_version'))
// The published jar declares exactly its group's versions, so Fabric Loader shows a clear "needs Minecraft X"
// message on any other version instead of letting the game crash on an API that changed. Members only build to
// prove their classes match the lead's, so they declare just their own version.
def depItems = sacIsLead ? sacGroupVersions : [mcVersion]
// Written into fabric.mod.json as ["${minecraft_dep}"], so the unexpanded template is still valid JSON.
ext.sacMinecraftDepItems = depItems.join('","')
def groupSuffix = sacGroupVersions.size() > 1 ? "${sacGroupVersions.first()}-${sacGroupVersions.last()}" : leadVersion
ext.sacArchiveSuffix = sacIsLead ? groupSuffix : mcVersion

def releaseJarTask = tasks.names.contains('remapJar') ? tasks.named('remapJar') : tasks.named('jar')
ext.sacReleaseJarFile = releaseJarTask.flatMap { it.archiveFile }
tasks.register('sacReleaseJar') { dependsOn releaseJarTask }

// Everything a release jar may contain. Anything else (test classes, stray copies of resources) fails the build.
def jarAllowlist = [
		~/META-INF\//,
		~/META-INF\/MANIFEST\.MF/,
		~/fabric\.mod\.json/,
		~/smart-autoclicker\.mixins\.json/,
		~/smart-autoclicker-refmap\.json/,
		~/LICENSE_smart-autoclicker-mc[0-9.-]+/,
		~/assets\//,
		~/assets\/smart-autoclicker\//,
		~/assets\/smart-autoclicker\/icon\.png/,
		~/assets\/smart-autoclicker\/lang\//,
		~/assets\/smart-autoclicker\/lang\/en_us\.json/,
		~/com\//,
		~/com\/simplyag\//,
		~/com\/simplyag\/autoclicker\/([A-Za-z0-9_$]+\/)*/,
		~/com\/simplyag\/autoclicker\/([A-Za-z0-9_$]+\/)*[A-Za-z0-9_$]+\.class/,
]
def requiredEntries = ['fabric.mod.json', 'smart-autoclicker.mixins.json',
					   'assets/smart-autoclicker/icon.png', 'assets/smart-autoclicker/lang/en_us.json']

def verifyJarContents = tasks.register('verifyJarContents') {
	group = 'verification'
	description = 'Fails if the release jar holds files outside the allowlist or misses required ones.'
	dependsOn releaseJarTask
	def jarFile = sacReleaseJarFile
	def expectedMixinLevel = "JAVA_${sacJavaVersion}"
	def expectedMinecraft = depItems
	def expectedVersion = project.version.toString()
	inputs.file(jarFile)
	doLast {
		def problems = []
		new ZipFile(jarFile.get().asFile).withCloseable { zip ->
			def names = zip.entries().collect { it.name }
			names.findAll { n -> !jarAllowlist.any { n ==~ it } }.each { problems << "unexpected entry: ${it}" }
			requiredEntries.findAll { !names.contains(it) }.each { problems << "missing entry: ${it}" }
			if (!names.any { it.startsWith('LICENSE_') }) problems << 'missing LICENSE'
			if (names.contains('fabric.mod.json')) {
				def fmj = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
				if (fmj.version != expectedVersion) problems << "fabric.mod.json version ${fmj.version} != ${expectedVersion}"
				if (fmj.depends.minecraft != expectedMinecraft) problems << "fabric.mod.json minecraft ${fmj.depends.minecraft} != ${expectedMinecraft}"
			}
			if (names.contains('smart-autoclicker.mixins.json')) {
				def level = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('smart-autoclicker.mixins.json'))).compatibilityLevel
				if (level != expectedMixinLevel) problems << "mixin compatibilityLevel ${level} != ${expectedMixinLevel}"
			}
		}
		if (problems) throw new GradleException("${jarFile.get().asFile.name}:\n  " + problems.join('\n  '))
	}
}
tasks.named('build') { dependsOn verifyJarContents }
