// Build script for every Minecraft version project (Stonecutter runs it once per versions/<mc>).
// The unobfuscated targets (26.1+) use Mojang names natively: non-remapping Loom, no mappings, Java 25.

plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Release groups and the jar allowlist; sets the ext.sac* values used below.
apply from: rootProject.file('gradle/release-target.gradle')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${sacArchiveSuffix}"
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: Mod Menu adds a config button. Not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// In-game client tests: ./gradlew :26.3:runClientGameTest (creates a world, runs each feature, saves screenshots)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "smart-autoclicker-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Every member of a release group compiles at the group lead's Java level, so its classes can be compared byte for
// byte with the lead's and the lead's jar runs on all of them.
def javaVersion = sacJavaVersion as int

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", sacMinecraftDepItems
	inputs.property "java_version", javaVersion
	inputs.property "loader_floor", project.loader_floor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_dep": sacMinecraftDepItems,
				"java_version": javaVersion,
				"loader_floor": project.loader_floor
	}

	// The shared mixins.json says JAVA_21; Mixin refuses levels the running Java can't do, so set it per target.
	filesMatching("smart-autoclicker.mixins.json") {
		filter { String line -> line.replace('"JAVA_21"', "\"JAVA_${javaVersion}\"") }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = "UTF-8"
	// One fixed javac per target, whatever JDK runs Gradle: javac versions number lambdas differently, which would
	// make otherwise identical classes differ between a group's members.
	it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	// Each version project has its own directory, so the license comes from the root.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	// Test alongside another mod: -PtestMods=/absolute/path/to/mod.jar (e.g. Freecam)
	if (project.hasProperty('testMods')) systemProperty 'fabric.addMods', project.property('testMods')
}
