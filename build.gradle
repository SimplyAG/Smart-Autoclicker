plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

dependencies {
	// Minecraft 26.x ships unobfuscated, so there are no mappings and no remapping.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: Mod Menu adds a config button. Not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// In-game client tests: ./gradlew runClientGameTest (creates a world, runs each feature, saves screenshots)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "smart-autoclicker-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Test alongside another mod: ./gradlew runClientGameTest -PtestMods=path/to/mod.jar
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('testMods')) systemProperty 'fabric.addMods', project.property('testMods')
}
