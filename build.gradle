// Build script for the unobfuscated Minecraft targets (26.1+): Mojang names natively, non-remapping Loom, no
// mappings, Java 25. The obfuscated targets (1.21.x) use remap.gradle instead (chosen in settings.gradle).

plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Release groups and the jar allowlist; sets the ext.sac* values used below.
apply from: rootProject.file('gradle/release-target.gradle')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${sacArchiveSuffix}"
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: Mod Menu adds a config button. Not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// Resources, Java level, jar contents and the in-game tests: shared with remap.gradle.
apply from: rootProject.file('gradle/target-common.gradle')
