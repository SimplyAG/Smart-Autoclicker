# Fails (and so emails the repository owner) when Mojang has released a Minecraft version this mod doesn't
# support yet. Runs daily; snapshots are ignored.
name: new minecraft release

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compare Mojang's latest release with release-groups.json
        run: |
          latest=$(curl --fail --silent https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.latest.release')
          if jq -e --arg v "$latest" '[.groups[].minecraft[]] | index($v)' release-groups.json > /dev/null; then
            echo "Minecraft $latest is supported."
          else
            echo "::error::Minecraft $latest is out and not supported yet. Add versions/$latest, list it in settings.gradle, then either add it to an existing group in release-groups.json (only if verifyGroupClasses and the in-game tests pass) or give it its own group."
            exit 1
          fi
