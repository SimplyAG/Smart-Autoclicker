# Builds every Minecraft version, proves each release group's members compile to identical classes, and runs the
# in-game tests on every supported version. Runs on every push and pull request, and weekly to catch breakage from
# updated dependencies.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      minecraft: ${{ steps.list.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v6
      # The test matrix comes from release-groups.json, so it can't drift from what is published.
      - id: list
        run: echo "minecraft=$(jq -c '[.groups[].minecraft[]]' release-groups.json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # 21 builds and runs the 1.21.x targets, 25 the 26.x ones and Gradle (the last one listed is the default).
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x ./gradlew
      - run: ./gradlew build verifyGroupClasses --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
            build/release/group-classes.txt

  gametest:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.versions.outputs.minecraft) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # 21 builds and runs the 1.21.x targets, 25 the 26.x ones and Gradle (the last one listed is the default).
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x ./gradlew
      # Software rendering for the headless game, as Fabric API's own client game tests use. 1.21.x renders with
      # OpenGL through GLFW and needs a display, so it runs inside a virtual X server.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: In-game tests
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        # Fabric's test world must finish loading within one minute of game ticks. On these software-rendered runners
        # the 1.21.9+ integrated server sometimes stalls while preparing the spawn area and never gets there (the same
        # versions load in about two seconds in other runs). Only that failure is retried, up to three attempts; any
        # failing test fails the job straight away.
        run: |
          run_tests() {
            if [[ "$MINECRAFT" == 1.* ]]; then
              xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew ":$MINECRAFT:runClientGameTest" --stacktrace
            else
              ./gradlew ":$MINECRAFT:runClientGameTest" --stacktrace
            fi
          }
          for attempt in 1 2 3; do
            if run_tests 2>&1 | tee test-output.log; [[ ${PIPESTATUS[0]} -eq 0 ]]; then exit 0; fi
            if ! grep -q 'AssertionError: Timeout loading world' test-output.log; then exit 1; fi
            echo "::warning::Minecraft $MINECRAFT: the test world didn't load in time (attempt $attempt of 3)"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots
